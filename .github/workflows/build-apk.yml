# Viaura - build release APKs (per-ABI + universal) and upload them as artifacts.
name: Build APK

on:
  push:
    branches:
      - main
      - master
  # Stable update: publish a normal GitHub Release (tag like v1.1, the description = what the app shows in "What's New").
  # This workflow then builds the APKs and attaches them to that release.
  release:
    types: [published]
  # Manual run (Actions -> Build APK -> Run workflow): untick a feature to build a test APK without it, to find out which one
  # Google Play Protect dislikes. Normal pushes / releases always build with everything ON.
  workflow_dispatch:
    inputs:
      enable_cloudstream:
        description: "CloudStream extensions (.cs3 loaded at runtime)"
        type: boolean
        default: true
      enable_updater:
        description: "In-app updater (+ install-apps permission)"
        type: boolean
        default: true
      enable_ytdlp:
        description: "yt-dlp / Python runtime"
        type: boolean
        default: true

# needed to create / upload GitHub Releases (the in-app updater downloads the APKs from there)
permissions:
  contents: write

env:
  # Only used while the repository has no published release yet. Afterwards builds are named <latest release tag>beta<run number>.
  BASE_VERSION: "1.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ---------- 1. SOURCE & ASSETS ----------
      - name: Checkout repository
        uses: actions/checkout@v7

      # Files that were renamed / moved in the feature-folder reorganisation. If the new ZIP was extracted over an old repo the
      # old copies are still there and would be compiled twice (redeclaration errors) - this removes them first.
      - name: Remove legacy file paths (old names before the feature-folder reorganisation)
        run: |
          set -e
          n=0
          while IFS= read -r p; do
            case "$p" in ''|'#'*) continue ;; esac
            if [ -e "$p" ]; then rm -f "$p"; n=$((n+1)); fi
          done < .github/legacy-paths.txt
          find app/src tools -type d -empty -delete 2>/dev/null || true
          echo "removed $n legacy file(s)"

      # Small-file source folders live in the repo only as zips (entries relative to app/src). Always re-extracted so the build
      # never uses a stale unpacked copy.
      - name: Unpack packed source folders (lyrics providers, widgets, unit tests)
        run: |
          set -e
          rm -rf app/src/main/java/com/example/lyrics/providers app/src/main/java/com/example/widgets app/src/test/java
          for Z in lyrics-providers-src widgets-src unit-tests-src; do
            test -f "app/src/$Z.zip" || { echo "::error::app/src/$Z.zip is missing"; exit 1; }
            unzip -q -o "app/src/$Z.zip" -d app/src
          done
          test -f app/src/main/java/com/example/lyrics/providers/LyricsSourceRegistry.kt
          test -f app/src/main/java/com/example/widgets/ViauraStyledIcon.kt
          echo "packed sources ready: $(find app/src/main/java/com/example/lyrics/providers app/src/main/java/com/example/widgets app/src/test/java -name '*.kt' | wc -l) Kotlin files"

      # The 145 viaura_*.xml vector icons are kept in the repo only as app/src/viaura-icons.zip (keeps the file list short).
      # This step unpacks them into app/src/main/res/drawable before anything else; the unpacked files are git-ignored.
      - name: Unpack vector icons (viaura-icons.zip)
        run: |
          set -e
          ZIP=app/src/viaura-icons.zip
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP was not found - the viaura_* icons cannot be built."
            exit 1
          fi
          unzip -q -o "$ZIP" -d app/src/main/res
          test -f app/src/main/res/drawable/viaura_add_circle.xml
          echo "icons ready: $(ls app/src/main/res/drawable/viaura_*.xml | wc -l) files"

      # ---------- 0. VERSION (read by app/build.gradle.kts, used by the in-app updater) ----------
      # build number = run number (always rising = versionCode); release build -> version = release tag, push build -> Nightly
      - name: Compute app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BUILD="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            # published release: version = release tag (v1.1 -> 1.1), files Viaura-v1.1_<abi>
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            VERSION="${VERSION#V}"
            ARTIFACT_VERSION="v${VERSION}"
          else
            # push / manual run: <newest published release>beta<run number> -> Viaura-v1.1beta6_<abi>
            # (the beta number is the Actions run number = the app's build number, so the app can compare builds)
            # No release yet -> GitHub answers 404 with a JSON error text; it must never end up in the version name.
            LATEST_TAG=""
            if RESP=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null); then
              LATEST_TAG=$(printf '%s' "$RESP" | jq -r '.tag_name // empty' 2>/dev/null || true)
            fi
            LATEST="${LATEST_TAG#v}"
            LATEST="${LATEST#V}"
            # accept only a plain version such as 1.1 / 2.0.3 (digits first, then letters, digits, dots, dashes)
            if ! printf '%s' "$LATEST" | grep -Eq '^[0-9][A-Za-z0-9._-]*$'; then LATEST="${BASE_VERSION}"; fi
            VERSION="${LATEST}beta${BUILD}"
            ARTIFACT_VERSION="v${VERSION}"
          fi
          echo "VIAURA_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VIAURA_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          # Actions artifact name (downloads as a .zip): Viaura-v1.1beta6_arm64-v8a  /  for a release: Viaura-v1.1_arm64-v8a
          echo "VIAURA_ARTIFACT_PREFIX=Viaura-${ARTIFACT_VERSION}" >> "$GITHUB_ENV"
          echo "Building Viaura $VERSION (build $BUILD) for $GITHUB_REPOSITORY"

      - name: Fetch yt-dlp Python standard library archive
        run: |
          set -e
          mkdir -p app/src/ytdlp/assets/ytdl
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -o app/src/ytdlp/assets/ytdl/python313.zip \
            "https://raw.githubusercontent.com/Riteshp2001/mpvRx/master/app/src/ytdlp/assets/ytdl/python313.zip"
          test -s app/src/ytdlp/assets/ytdl/python313.zip
          unzip -t app/src/ytdlp/assets/ytdl/python313.zip >/dev/null
          ls -lh app/src/ytdlp/assets/ytdl/python313.zip

      # The newest yt-dlp release is packed INTO the app: installing it on the phone is a file copy (no download, no wait),
      # and the app then only checks for a newer version in the background.
      - name: Fetch latest yt-dlp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT=app/src/ytdlp/assets/ytdl/yt-dlp
          mkdir -p app/src/ytdlp/assets/ytdl
          # github.com release downloads sometimes answer 504 for a while: retry with a growing pause, and fall back to
          # the authenticated GitHub API (gh) and the nightly repository when the plain download keeps failing.
          valid() { [ -s "$OUT" ] && unzip -l "$OUT" 2>/dev/null | grep -q "yt_dlp/version.py"; }
          fetch_curl() {
            curl -fL --retry 3 --retry-delay 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$OUT" "$1"
          }
          OK=0
          for i in 1 2 3 4; do
            rm -f "$OUT"
            if fetch_curl "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" && valid; then OK=1; break; fi
            echo "::warning::yt-dlp download attempt $i failed (curl)"
            rm -f "$OUT"
            if gh release download --repo yt-dlp/yt-dlp --pattern yt-dlp --output "$OUT" --clobber && valid; then OK=1; break; fi
            echo "::warning::yt-dlp download attempt $i failed (gh)"
            rm -f "$OUT"
            if gh release download --repo yt-dlp/yt-dlp-nightly-builds --pattern yt-dlp --output "$OUT" --clobber && valid; then OK=1; break; fi
            echo "::warning::yt-dlp download attempt $i failed (nightly)"
            sleep $((i * 10))
          done
          if [ "$OK" != "1" ]; then
            echo "::error::yt-dlp could not be downloaded from GitHub (all mirrors failed)."
            exit 1
          fi
          ls -lh "$OUT"

      # Anime4K (MIT) GLSL shaders for the player's "Anime4K Shaders" switch. Not kept in the repo: cloned here and flattened into
      # app/src/main/assets/anime4k/. A failed download never breaks the build - the app then shows the switch as unavailable.
      - name: Fetch Anime4K shaders
        run: |
          set +e
          rm -rf /tmp/anime4k-src app/src/main/assets/anime4k
          mkdir -p app/src/main/assets/anime4k
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/bloc97/Anime4K.git /tmp/anime4k-src && break
            rm -rf /tmp/anime4k-src; sleep 5
          done
          if [ -d /tmp/anime4k-src/glsl ]; then
            find /tmp/anime4k-src/glsl -type f -name 'Anime4K_*.glsl' -exec cp {} app/src/main/assets/anime4k/ \;
          fi
          MISSING=0
          for F in Anime4K_Clamp_Highlights Anime4K_AutoDownscalePre_x2 Anime4K_AutoDownscalePre_x4 \
                   Anime4K_Restore_CNN_M Anime4K_Restore_CNN_VL Anime4K_Restore_CNN_Soft_M Anime4K_Restore_CNN_Soft_VL \
                   Anime4K_Upscale_CNN_x2_S Anime4K_Upscale_CNN_x2_M Anime4K_Upscale_CNN_x2_VL \
                   Anime4K_Upscale_Denoise_CNN_x2_M Anime4K_Upscale_Denoise_CNN_x2_VL; do
            [ -s "app/src/main/assets/anime4k/$F.glsl" ] || { echo "::warning::Anime4K shader missing: $F.glsl"; MISSING=1; }
          done
          echo "Anime4K shaders ready: $(ls app/src/main/assets/anime4k | wc -l) files (missing=$MISSING)"
          exit 0

      # QuickJS-NG (MIT) is the JavaScript runtime yt-dlp needs for YouTube challenges. Its C sources (~3 MB) are NOT kept
      # in the repo any more: this step downloads the pinned release and recreates app/src/main/cpp/third_party/quickjs
      # exactly as CMakeLists.txt expects it (byte-identical to the files that used to be committed).
      - name: Fetch QuickJS-NG sources
        run: |
          set -e
          QJS_VERSION="v0.16.2"
          DIR=app/src/main/cpp/third_party/quickjs
          rm -rf "$DIR" /tmp/qjs-src
          mkdir -p "$DIR/gen" /tmp/qjs-src
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -o /tmp/quickjs.tar.gz \
            "https://github.com/quickjs-ng/quickjs/archive/refs/tags/${QJS_VERSION}.tar.gz"
          tar -xzf /tmp/quickjs.tar.gz -C /tmp/qjs-src --strip-components=1
          for f in LICENSE builtin-array-fromasync.h builtin-iterator-zip-keyed.h builtin-iterator-zip.h cutils.h \
                   dtoa.c dtoa.h libregexp-opcode.h libregexp.c libregexp.h libunicode-table.h libunicode.c \
                   libunicode.h list.h qjs.c quickjs-atom.h quickjs-c-atomics.h quickjs-libc.c quickjs-libc.h \
                   quickjs-opcode.h quickjs.c quickjs.h gen/repl.c gen/standalone.c; do
            test -s "/tmp/qjs-src/$f" || { echo "::error::QuickJS-NG $QJS_VERSION is missing $f"; exit 1; }
            cp "/tmp/qjs-src/$f" "$DIR/$f"
          done
          grep -E "define QJS_VERSION_(MAJOR|MINOR|PATCH)" "$DIR/quickjs.h"
          rm -rf /tmp/qjs-src /tmp/quickjs.tar.gz

      # yt-dlp runtime (ported from mpvRx). cacert.pem (CA bundle for yt-dlp's TLS) is fetched here.
      #
      # libpython.so (CPython 3.13 with its extension modules built in) is a prebuilt binary per ABI and is NOT part of
      # the sources. Without it yt-dlp fails with: "Could not load libpython.so: dlopen failed: library libpython.so not
      # found". If app/src/ytdlp/jniLibs/<abi>/libpython.so is not committed, it is taken from the mpvRx release APK
      # (the project this runtime was ported from) at build time. Set the MPVRX_APK_URL repository variable to pin a
      # specific APK; committing the four files yourself always wins over the download.
      - name: Fetch yt-dlp CA bundle and libpython.so
        env:
          GH_TOKEN: ${{ github.token }}
          MPVRX_APK_URL: ${{ vars.MPVRX_APK_URL }}
        run: |
          set -e
          mkdir -p app/src/ytdlp/assets
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -o app/src/ytdlp/assets/cacert.pem "https://curl.se/ca/cacert.pem"
          ls -lh app/src/ytdlp/assets/cacert.pem

          ABIS="arm64-v8a armeabi-v7a x86 x86_64"
          MISSING=""
          for ABI in $ABIS; do
            [ -s "app/src/ytdlp/jniLibs/$ABI/libpython.so" ] || MISSING="$MISSING $ABI"
          done

          if [ -n "$MISSING" ]; then
            echo "libpython.so missing in the repo for:$MISSING - taking it from the mpvRx release APK"
            URL="$MPVRX_APK_URL"
            if [ -z "$URL" ]; then
              curl -fsSL --retry 5 -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/Riteshp2001/mpvRx/releases/latest" -o /tmp/mpvrx-release.json
              URL=$(jq -r '[.assets[].browser_download_url | select(test("universal.*\\.apk$"))][0] // empty' /tmp/mpvrx-release.json)
            fi
            [ -n "$URL" ] || { echo "::error::Could not find the mpvRx universal APK. Commit app/src/ytdlp/jniLibs/<abi>/libpython.so or set the MPVRX_APK_URL repository variable."; exit 1; }
            echo "Downloading $URL"
            curl -fL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors -o /tmp/mpvrx.apk "$URL"
            for ABI in $MISSING; do
              mkdir -p "app/src/ytdlp/jniLibs/$ABI"
              unzip -o -j /tmp/mpvrx.apk "lib/$ABI/libpython.so" -d "app/src/ytdlp/jniLibs/$ABI" || true
              if [ ! -s "app/src/ytdlp/jniLibs/$ABI/libpython.so" ]; then
                echo "Native libraries inside that APK for $ABI:"
                unzip -l /tmp/mpvrx.apk "lib/$ABI/*" || true
              fi
            done
            rm -f /tmp/mpvrx.apk
          fi

          for ABI in $ABIS; do
            if [ -s "app/src/ytdlp/jniLibs/$ABI/libpython.so" ]; then
              echo "libpython.so ready for $ABI ($(du -h "app/src/ytdlp/jniLibs/$ABI/libpython.so" | cut -f1))"
            else
              echo "::error::app/src/ytdlp/jniLibs/$ABI/libpython.so is missing - yt-dlp would fail with 'Could not load libpython.so'."
              exit 1
            fi
          done

      # settings.gradle.kts includes :cloudstream-lib with projectDir app/src/cloudstream-lib. The module sources are kept in the
      # repo only as app/src/cloudstream-lib.zip; this step unpacks them before Gradle starts (the folder is never committed).
      - name: Prepare CloudStream runtime module (cloudstream-lib)
        run: |
          set -e
          DIR=app/src/cloudstream-lib
          ZIP=app/src/cloudstream-lib.zip
          if [ ! -f "$DIR/build.gradle.kts" ]; then
            if [ ! -f "$ZIP" ]; then
              echo "::error::$DIR is missing and $ZIP was not found - :cloudstream-lib cannot be configured."
              exit 1
            fi
            rm -rf "$DIR" /tmp/csl-src
            mkdir -p /tmp/csl-src
            unzip -q -o "$ZIP" -d /tmp/csl-src
            if [ -d /tmp/csl-src/cloudstream-lib ]; then
              mv /tmp/csl-src/cloudstream-lib "$DIR"
            else
              mkdir -p "$DIR"
              cp -r /tmp/csl-src/. "$DIR"/
            fi
          fi
          test -f "$DIR/build.gradle.kts"
          test -d "$DIR/src/main/kotlin"
          echo "cloudstream-lib ready: $(find "$DIR/src" -type f | wc -l) source files"

      # ---------- 2. TOOLCHAIN SETUP ----------
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google ne purana "tools" package hata diya hai — action by-default
          # "tools platform-tools" install karne ki koshish karta hai, jisse
          # "Failed to find package 'tools'" error aakar poori job cancel ho jaati thi.
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify Android resources and SDK before Gradle
        run: |
          set -e
          echo "=== Duplicate Android resource check ==="
          DUPLICATES=$(find app/src/main/res -type f | sed 's#.*/##' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "::error::Duplicate resource filenames detected:"
            echo "$DUPLICATES"
            exit 1
          fi
          if find . -type d \( -iname "*icon-res*" -o -iname "res2" \) -not -path "*/build/*" | grep -q .; then
            echo "::error::Unsupported parallel Android resource directory detected."
            find . -type d \( -iname "*icon-res*" -o -iname "res2" \) -not -path "*/build/*"
            exit 1
          fi
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.1
          cache-read-only: false
          add-job-summary: never
          add-job-summary-as-pr-comment: never

      - name: Choose build command (project wrapper if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Project ka apna gradlew mil gaya — usi version se build karenge (zyada stable)."
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "gradlew nahi mila — system Gradle 9.8.1 se build hoga."
          fi

      - name: Increase Gradle memory headroom (avoid OOM kills)
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties

      # The APKs must ALWAYS be signed with the same key, otherwise Android refuses to install a new version over the old one.
      # debug.keystore is binary and can get lost when the project is uploaded, so it is also kept as text in
      # .github/signing/debug.keystore.b64 (the old location signing/ is still accepted) and rebuilt from there when the
      # binary file is missing. A random temporary key is never created.
      - name: Prepare fixed signing keystore
        env:
          HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_B64 != '' && secrets.STORE_PASSWORD != '' }}
        run: |
          set -e
          B64=""
          for f in .github/signing/debug.keystore.b64 signing/debug.keystore.b64; do
            if [ -f "$f" ]; then B64="$f"; break; fi
          done
          if [ ! -f debug.keystore ] && [ -n "$B64" ]; then
            echo "debug.keystore missing - restoring it from $B64"
            base64 -d "$B64" > debug.keystore
          fi
          if [ ! -f debug.keystore ] && [ "$HAS_RELEASE_KEY" = "true" ]; then
            # Release APKs are signed with the key from GitHub Secrets; the debug key is then only a placeholder
            # that Gradle's signing config points at, so a throw-away one is enough.
            echo "No debug.keystore - creating a placeholder (release key from Secrets is used for the APKs)"
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          fi
          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore and .github/signing/debug.keystore.b64 are both missing. Add one of them to the repository: without a fixed key every build is signed differently and the in-app update cannot install."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android | grep -E "androiddebugkey|SHA-256"

      # Real release key (kept ONLY in GitHub Secrets, never in the repo). If the secrets exist the APKs are signed with it;
      # if not, the build falls back to the old debug key exactly as before.
      - name: Prepare release signing key (GitHub Secrets)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'viaura' }}
        run: |
          set -e
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/viaura-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/viaura-release.jks" >> "$GITHUB_ENV"
            keytool -list -keystore "$RUNNER_TEMP/viaura-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "viaura|SHA-256|Certificate fingerprint" || true
            echo "Release key restored - APKs will be signed with it."
          else
            echo "::warning::RELEASE_KEYSTORE_B64 / STORE_PASSWORD secrets not set - falling back to the debug key."
          fi

      # ---------- 3. BUILD ----------
      - name: Build Release APKs
        env:
          ENABLE_CLOUDSTREAM: ${{ github.event.inputs.enable_cloudstream || 'true' }}
          ENABLE_UPDATER: ${{ github.event.inputs.enable_updater || 'true' }}
          ENABLE_YTDLP: ${{ github.event.inputs.enable_ytdlp || 'true' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'viaura' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          $GRADLE_CMD :app:assembleRelease --stacktrace --no-daemon --console=plain --build-cache

      # ---------- 4. VERIFY OUTPUT ----------
      - name: Locate and Verify Generated APKs across output folders
        id: find_apks
        run: |
          BASE_APK_DIR="app/build/outputs/apk"
          echo "=== Searching for generated APKs in $BASE_APK_DIR ==="

          if [ ! -d "$BASE_APK_DIR" ]; then
            echo "::error::Output directory $BASE_APK_DIR does not exist!"
            exit 1
          fi

          echo "All generated APK files found:"
          find "$BASE_APK_DIR" -type f -name "*.apk" -exec ls -lh {} +

          TOTAL_APKS=$(find "$BASE_APK_DIR" -type f -name "*.apk" | wc -l)
          if [ "$TOTAL_APKS" -eq 0 ]; then
            echo "::error::No APK files found under $BASE_APK_DIR! Build failed."
            exit 1
          fi

          ARM64=$(find "$BASE_APK_DIR" -type f -name "*arm64-v8a*.apk" | head -n 1)
          ARMEABI=$(find "$BASE_APK_DIR" -type f -name "*armeabi-v7a*.apk" | head -n 1)
          X86_64=$(find "$BASE_APK_DIR" -type f -name "*x86_64*.apk" | head -n 1)
          X86=$(find "$BASE_APK_DIR" -type f -name "*x86*.apk" ! -name "*x86_64*" | head -n 1)
          UNIVERSAL=$(find "$BASE_APK_DIR" -type f -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL" ]; then
            UNIVERSAL=$(find "$BASE_APK_DIR" -type f -name "*.apk" | head -n 1)
          fi

          FOUND_COUNT=0

          if [ -n "$ARM64" ] && [ -f "$ARM64" ]; then
            echo "arm64_path=$ARM64" >> $GITHUB_OUTPUT
            echo "arm64_found=true" >> $GITHUB_OUTPUT
            echo "✓ Found arm64-v8a: $ARM64 ($(du -h "$ARM64" | cut -f1))"
            FOUND_COUNT=$((FOUND_COUNT + 1))
          else
            echo "::warning::arm64-v8a APK not found in $BASE_APK_DIR"
            echo "arm64_found=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$ARMEABI" ] && [ -f "$ARMEABI" ]; then
            echo "armeabi_path=$ARMEABI" >> $GITHUB_OUTPUT
            echo "armeabi_found=true" >> $GITHUB_OUTPUT
            echo "✓ Found armeabi-v7a: $ARMEABI ($(du -h "$ARMEABI" | cut -f1))"
            FOUND_COUNT=$((FOUND_COUNT + 1))
          else
            echo "::warning::armeabi-v7a APK not found in $BASE_APK_DIR"
            echo "armeabi_found=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$X86" ] && [ -f "$X86" ]; then
            echo "x86_path=$X86" >> $GITHUB_OUTPUT
            echo "x86_found=true" >> $GITHUB_OUTPUT
            echo "✓ Found x86: $X86 ($(du -h "$X86" | cut -f1))"
            FOUND_COUNT=$((FOUND_COUNT + 1))
          else
            echo "::warning::x86 APK not found in $BASE_APK_DIR"
            echo "x86_found=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$X86_64" ] && [ -f "$X86_64" ]; then
            echo "x86_64_path=$X86_64" >> $GITHUB_OUTPUT
            echo "x86_64_found=true" >> $GITHUB_OUTPUT
            echo "✓ Found x86_64: $X86_64 ($(du -h "$X86_64" | cut -f1))"
            FOUND_COUNT=$((FOUND_COUNT + 1))
          else
            echo "::warning::x86_64 APK not found in $BASE_APK_DIR"
            echo "x86_64_found=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$UNIVERSAL" ] && [ -f "$UNIVERSAL" ]; then
            echo "universal_path=$UNIVERSAL" >> $GITHUB_OUTPUT
            echo "universal_found=true" >> $GITHUB_OUTPUT
            echo "✓ Found universal: $UNIVERSAL ($(du -h "$UNIVERSAL" | cut -f1))"
            FOUND_COUNT=$((FOUND_COUNT + 1))
          else
            echo "::warning::universal APK not found in $BASE_APK_DIR"
            echo "universal_found=false" >> $GITHUB_OUTPUT
          fi

          echo "=== Total matched ABI APKs: $FOUND_COUNT ==="

          if [ "$FOUND_COUNT" -eq 0 ]; then
            echo "::error::All target ABI APKs are missing! Check build outputs."
            exit 1
          fi

          echo "### 📦 Build APK Artifacts Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | ABI / Variant | File Path | Size | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          [ -n "$ARM64" ] && echo "| \`app-arm64-v8a\` | arm64-v8a | \`$ARM64\` | $(du -h "$ARM64" | cut -f1) | ✅ Available |" >> $GITHUB_STEP_SUMMARY || echo "| \`app-arm64-v8a\` | arm64-v8a | - | - | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          [ -n "$ARMEABI" ] && echo "| \`app-armeabi-v7a\` | armeabi-v7a | \`$ARMEABI\` | $(du -h "$ARMEABI" | cut -f1) | ✅ Available |" >> $GITHUB_STEP_SUMMARY || echo "| \`app-armeabi-v7a\` | armeabi-v7a | - | - | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          [ -n "$X86" ] && echo "| \`app-x86\` | x86 | \`$X86\` | $(du -h "$X86" | cut -f1) | ✅ Available |" >> $GITHUB_STEP_SUMMARY || echo "| \`app-x86\` | x86 | - | - | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          [ -n "$X86_64" ] && echo "| \`app-x86_64\` | x86_64 | \`$X86_64\` | $(du -h "$X86_64" | cut -f1) | ✅ Available |" >> $GITHUB_STEP_SUMMARY || echo "| \`app-x86_64\` | x86_64 | - | - | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
          [ -n "$UNIVERSAL" ] && echo "| \`app-universal\` | Universal (All ABIs) | \`$UNIVERSAL\` | $(du -h "$UNIVERSAL" | cut -f1) | ✅ Available |" >> $GITHUB_STEP_SUMMARY || echo "| \`app-universal\` | Universal | - | - | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY

      # Clean file names, used for the Actions artifacts AND the GitHub Release: Viaura-v1.1_arm64-v8a.apk (release) / Viaura-v1.1beta3_arm64-v8a.apk (push)
      - name: Rename APKs (Viaura-v<version>_<abi>.apk)
        run: |
          set -e
          OUT=release-assets
          rm -rf "$OUT"; mkdir -p "$OUT"
          while IFS= read -r f; do
            n=$(basename "$f")
            case "$n" in
              *universal*) ABI=universal ;;
              *arm64-v8a*) ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *x86_64*) ABI=x86_64 ;;
              *x86*) ABI=x86 ;;
              *) ABI=universal ;;
            esac
            cp "$f" "$OUT/Viaura-v${VIAURA_VERSION_NAME}_${ABI}.apk"
          done < <(find app/build/outputs/apk -type f -name "*.apk")
          ls -lh "$OUT"

      # ---------- 5. UPLOAD ----------
      # Build already succeeded at this point. A GitHub-side artifact hiccup (HTTP 403 while
      # finalizing, storage quota, ...) must not fail the whole run or skip the remaining
      # uploads, so every upload is best-effort (continue-on-error) and the most useful APKs
      # for phones (arm64-v8a, universal) go first. Short retention keeps the account's
      # artifact storage quota from filling up.
      - name: Upload arm64-v8a APK
        if: steps.find_apks.outputs.arm64_found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VIAURA_ARTIFACT_PREFIX }}_arm64-v8a
          path: release-assets/Viaura-v${{ env.VIAURA_VERSION_NAME }}_arm64-v8a.apk
          retention-days: 3

      - name: Upload Universal APK
        if: steps.find_apks.outputs.universal_found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VIAURA_ARTIFACT_PREFIX }}_universal
          path: release-assets/Viaura-v${{ env.VIAURA_VERSION_NAME }}_universal.apk
          retention-days: 3

      - name: Upload armeabi-v7a APK
        if: steps.find_apks.outputs.armeabi_found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VIAURA_ARTIFACT_PREFIX }}_armeabi-v7a
          path: release-assets/Viaura-v${{ env.VIAURA_VERSION_NAME }}_armeabi-v7a.apk
          retention-days: 3

      - name: Upload x86 APK
        if: steps.find_apks.outputs.x86_found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VIAURA_ARTIFACT_PREFIX }}_x86
          path: release-assets/Viaura-v${{ env.VIAURA_VERSION_NAME }}_x86.apk
          retention-days: 3

      - name: Upload x86_64 APK
        if: steps.find_apks.outputs.x86_64_found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VIAURA_ARTIFACT_PREFIX }}_x86_64
          path: release-assets/Viaura-v${{ env.VIAURA_VERSION_NAME }}_x86_64.apk
          retention-days: 3

      # ---------- 6. GITHUB RELEASE (what the in-app updater reads) ----------
      # The app reads the build number of every release from a tiny marker asset (viaura-build-<run>.txt), because a stable
      # release is named just Viaura-v1.1_<abi>.apk (no build number in the name). Without it a stable release looked
      # "newer than every nightly" to the updater and Preview (Nightly) never offered the new builds.
      #  - release event  : the APKs + marker are attached to the release you published (your description stays untouched)
      #  - push / manual  : a "Nightly" pre-release (tag nightly-<run>) is created (Settings > About > Updates > Preview (Nightly)); only the newest 5 are kept
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT=release-assets
          echo "${VIAURA_VERSION_NAME}" > "$OUT/viaura-build-${VIAURA_BUILD_NUMBER}.txt"
          ls -lh "$OUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "${{ github.event.release.tag_name }}" "$OUT"/* --clobber
          else
            TAG="nightly-${VIAURA_BUILD_NUMBER}"
            {
              echo "## Viaura v${VIAURA_VERSION_NAME}"
              echo
              echo "Automatic preview build of commit \`${GITHUB_SHA::7}\` - may be unstable."
              echo
              echo "Build options: CloudStream=${{ github.event.inputs.enable_cloudstream || 'true' }}, Updater=${{ github.event.inputs.enable_updater || 'true' }}, yt-dlp=${{ github.event.inputs.enable_ytdlp || 'true' }}"
              echo
              echo "### Changes"
              git log -1 --pretty=%B | sed 's/^/- /' | sed '/^- $/d'
            } > notes.md
            gh release create "$TAG" "$OUT"/* \
              --target "$GITHUB_SHA" --prerelease \
              --title "v${VIAURA_VERSION_NAME}" --notes-file notes.md
            # keep the newest 5 nightlies
            gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' \
              | sort -t- -k2 -n -r | tail -n +6 \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
          fi
